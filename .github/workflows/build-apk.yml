name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and extract source
        run: |
          curl -L --retry 3 -o src.zip "https://drive.google.com/uc?export=download&id=1Ga9ava6dBLqrAxVG2E1JMW3lHPNVES5X"
          file src.zip
          unzip -q src.zip
          if [ -d IranScreenReader ]; then
            shopt -s dotglob
            mv IranScreenReader/* .
            rm -rf IranScreenReader
          fi
          rm -f src.zip
          ls -la
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Configure Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          ls -la "$ANDROID_HOME" || true
          # Accept licenses without interactive prompts
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo -e "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$ANDROID_HOME/licenses/google-gdk-license"
          # Find sdkmanager
          SM=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/tmp/licenses.txt 2>&1 || true
            "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

      - name: Install Gradle 8.9
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: |
          export PATH="/opt/gradle-8.9/bin:$PATH"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: List APKs
        if: always()
        run: find . -name "*.apk" -type f -ls || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iran-screenreader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
