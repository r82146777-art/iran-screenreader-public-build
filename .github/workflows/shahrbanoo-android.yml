name: Build Shahrbanoo Accessible APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/shahrbanoo-android.yml"

concurrency:
  group: shahrbanoo-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cancel old duplicate APK build runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for status in queued in_progress; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" \
              -q '.workflow_runs[] | select(.path == ".github/workflows/build-apk.yml" or .path == ".github/workflows/shahrbanoo-android.yml") | .id' |
            while read -r run_id; do
              [ -n "$run_id" ] || continue
              [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
              echo "Cancelling old duplicate build run $run_id"
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
            done
          done
      - name: Download bundled offline Persian neural voice
        run: |
          set -euo pipefail
          RELEASE="https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models"
          ASSETS="game/src/main/assets/tts"
          mkdir -p game/libs "$ASSETS" /tmp/fa-voice
          curl -fL --retry 3 "https://huggingface.co/csukuangfj/sherpa-onnx-libs/resolve/main/android/aar/sherpa-onnx-1.10.41.aar" -o game/libs/sherpa-onnx.aar
          curl -fL --retry 3 "$RELEASE/vits-piper-fa_IR-gyro-medium.tar.bz2" -o /tmp/fa-voice/model.tar.bz2
          tar -xjf /tmp/fa-voice/model.tar.bz2 -C /tmp/fa-voice
          MODEL="$(find /tmp/fa-voice -type f -name 'fa_IR-gyro-medium.onnx' -print -quit)"
          TOKENS="$(find /tmp/fa-voice -type f -name 'tokens.txt' -print -quit)"
          test -n "$MODEL" && test -n "$TOKENS"
          cp "$MODEL" "$ASSETS/model_fa.onnx"
          cp "$TOKENS" "$ASSETS/tokens_fa.txt"
          curl -fL --retry 3 "$RELEASE/espeak-ng-data.tar.bz2" -o /tmp/espeak-ng-data.tar.bz2
          tar -xjf /tmp/espeak-ng-data.tar.bz2 -C "$ASSETS"
          test -d "$ASSETS/espeak-ng-data"
          echo "Bundled Persian voice model size: $(du -h "$ASSETS/model_fa.onnx" | cut -f1)"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle --no-daemon :game:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shahrbanoo-accessible-debug-apk
          path: game/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
